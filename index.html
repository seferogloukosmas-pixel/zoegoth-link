
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0612">
    <title>Zoe Goth 🖤</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0612;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        .background-model {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: 65vh;
            background:
                url("https://iili.io/C9yUKFe.md.png")
                top center / cover no-repeat;
            z-index: 1;
            -webkit-mask-image: linear-gradient(
                to bottom,
                rgba(0,0,0,1) 50%,
                rgba(0,0,0,0) 100%
            );
            mask-image: linear-gradient(
                to bottom,
                rgba(0,0,0,1) 50%,
                rgba(0,0,0,0) 100%
            );
            opacity: 0.75;
        }

        .bg-glow {
            position: absolute;
            top: 40vh;
            width: 300px;
            height: 300px;
            background: #8a2be2;
            filter: blur(120px);
            opacity: 0.3;
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 360px;
            width: 90%;
            margin-top: 35vh;
            background: rgba(10, 6, 18, 0.7);
            padding: 30px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            text-shadow:
                0 2px 10px rgba(0,0,0,0.5);
        }

        .handle {
            font-size: 14px;
            color: #b366ff;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 22px;
        }

        .bio-text {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            line-height: 1.6;
            margin-bottom: 22px;
            padding: 0 5px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-link {
            display: block;
            width: 100%;
            padding: 15px 20px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-link:active {
            transform: scale(0.98);
        }

        .btn-main {
            background: linear-gradient(
                90deg, #8a2be2, #5200cc
            );
            border: none;
            box-shadow:
                0 4px 25px rgba(138,43,226,0.5);
            animation: pulse 2.5s infinite;
        }

        .offer-card {
            margin-top: 28px;
            padding: 22px 16px;
            background: rgba(100,35,160,0.13);
            border: 1px solid rgba(179,102,255,0.25);
            border-radius: 20px;
        }

        .offer-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #c48aff;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .offer-caption {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(255,255,255,0.93);
            margin-bottom: 18px;
        }

        .offer-caption p + p {
            margin-top: 12px;
        }

        .price {
            font-size: 27px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .price span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255,255,255,0.55);
            margin-top: 5px;
        }

        .btn-offer {
            background: linear-gradient(
                90deg, #9c39ed, #6800d6
            );
            border: none;
            box-shadow:
                0 4px 20px rgba(138,43,226,0.3);
        }

        @keyframes pulse {
            0% {
                box-shadow:
                    0 0 0 0 rgba(138,43,226,0.6);
            }
            70% {
                box-shadow:
                    0 0 0 15px rgba(138,43,226,0);
            }
            100% {
                box-shadow:
                    0 0 0 0 rgba(138,43,226,0);
            }
        }
    </style>
</head>

<body>

    <div class="background-model"></div>
    <div class="bg-glow"></div>

    <div class="container">

        <h1>Zoe Goth</h1>

        <div class="handle">@zoegoth</div>

        <div class="tagline">
            Your Favourite Vamp Goth 🦇
        </div>

        <div class="bio-text">
            Welcome to my dark side.<br>
            Enter at your own risk... 🖤🥀
        </div>

        <!-- MAIN FANVUE PAGE -->

        <div class="links-wrapper">
            <button
                data-gate="aHR0cHM6Ly93d3cuZmFudnVlLmNvbS96b2Vnb3RoL2Z2LTM="
                onclick="unlock(this)"
                class="btn-link btn-main">
                Behind The Scenes 🖤
            </button>
        </div>

        <!-- EXCLUSIVE PHOTO OFFER -->

        <div class="offer-card">

            <div class="offer-label">
                🖤 Exclusive Photo Drop
            </div>

            <div class="offer-caption">
                <p>
                    I saved 8 little surprises
                    for you... 🖤
                </p>

                <p>
                    Each one pulls you in deeper…
                    and the best ones are
                    waiting inside. 🦇
                </p>
            </div>

            <div class="price">
                $13.99
                <span>
                    8 Exclusive Photos • One-Time Purchase
                </span>
            </div>

            <!-- ENCODED PAID MEDIA LINK -->

            <button
                data-gate="aHR0cHM6Ly93d3cuZmFudnVlLmNvbS96b2Vnb3RoL21lZGlhL2Z2bWwtMQ=="
                onclick="unlock(this)"
                class="btn-link btn-offer">
                Unlock All 8 Photos 🖤
            </button>

        </div>

    </div>

    <script>
        function unlock(element) {
            const encoded =
                element.getAttribute('data-gate');

            if (!encoded) return;

            try {
                const decoded = atob(encoded);
                const url = new URL(decoded);

                if (
                    url.protocol !== 'https:' ||
                    url.hostname !== 'www.fanvue.com'
                ) return;

                window.open(
                    url.href,
                    '_blank',
                    'noopener,noreferrer'
                );
            } catch (error) {
                console.error('Invalid destination link');
            }
        }
    </script>

</body>
</html>
